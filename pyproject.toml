[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lwin"
version = "0.1.0"
description = "Offline educational passage-to-study-aid proof of concept"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lwin = "lwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
